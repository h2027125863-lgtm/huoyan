
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="transparent">
<title>宏福苑火灾时间线</title>

<style>
:root {
  color-scheme: dark;
  --warm: #eee6da;
  --soft: #bfc6ce;
  --ember: #ea7a4c;
  --red: #d14e3d;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: transparent !important;
  overflow-x: hidden;
}

body {
  font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.timeline-wrap {
  width: min(100%, 660px);
  margin: 0 auto;
  position: relative;
  background: transparent !important;
  isolation: isolate;
}

.timeline {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  background: transparent !important;
  user-select: none;
  -webkit-user-select: none;
}

/* 顶部火焰交互按钮 */
.top-trigger {
  cursor: pointer;
  outline: none;
  touch-action: manipulation;
  transform-origin: 300px 91px;
}

.top-trigger:focus-visible .outer-ring {
  stroke: #fff;
  stroke-width: 2;
  opacity: 1;
}

.fire-top {
  transform-origin: 300px 89px;
  animation: top-breathe 2.2s ease-in-out infinite;
}

.top-trigger:hover .fire-top {
  filter: drop-shadow(0 0 13px #d46c4b);
}

@keyframes top-breathe {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.065);
  }
}

/* 时间主线 */
.main-spine, .node-line {
  vector-effect: non-scaling-stroke;
}

.main-spine {
  stroke-dasharray: 1145;
  stroke-dashoffset: 1145;
  opacity: 0;
}

.timeline.is-playing .main-spine {
  opacity: 1;
  animation: trace 5s cubic-bezier(.23,.1,.25,1) both;
}

.timeline.is-complete .main-spine,
.timeline.is-preview .main-spine {
  opacity: 1;
  stroke-dashoffset: 0;
}

@keyframes trace {
  0% {
    stroke-dashoffset: 1145;
  }
  100% {
    stroke-dashoffset: 0;
  }
}

/* 事件逐个出现 */
.event {
  opacity: 0;
  transform: translateY(17px);
  transition:
    opacity .65s ease,
    transform .8s cubic-bezier(.18,.75,.2,1);
}

.event.visible {
  opacity: 1;
  transform: translateY(0);
}

/* 火焰动态效果 */
.event .fire-visual {
  transform-origin: center;
  animation: fire-flicker 2s ease-in-out infinite alternate;
}

@keyframes fire-flicker {
  0% {
    filter: drop-shadow(0 0 4px rgba(235,104,55,.3));
    opacity: .87;
  }
  100% {
    filter: drop-shadow(0 0 13px rgba(230,65,46,.7));
    opacity: 1;
  }
}

/* 时间节点出现 */
.pulse-dot {
  transform-box: fill-box;
  transform-origin: center;
}

.event.visible .pulse-dot {
  animation: dot-pop .45s ease-out both;
}

@keyframes dot-pop {
  0% { transform: scale(.15); }
  65% { transform: scale(1.35); }
  100% { transform: scale(1); }
}

/* 烟雾 */
.smoke-wisp {
  opacity: 0;
  transform: translateY(15px) scale(.8);
  transform-box: fill-box;
  transform-origin: center;
  transition:
    opacity 1.5s ease .25s,
    transform 2s ease;
}

.event.visible .smoke-wisp {
  opacity: .13;
  transform: translateY(-7px) scale(1.06);
}

/* 火星粒子 */
.micro-ember {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.event.visible .micro-ember {
  animation: ember-rise 2.9s ease-out infinite;
}

.event.visible .micro-ember:nth-of-type(2) {
  animation-delay: .8s;
}

.event.visible .micro-ember:nth-of-type(3) {
  animation-delay: 1.65s;
}

@keyframes ember-rise {
  0% {
    opacity: 0;
    transform: translateY(7px) scale(.5);
  }
  20% {
    opacity: .8;
  }
  100% {
    opacity: 0;
    transform: translateY(-45px) scale(.25);
  }
}

/* 文字样式 */
text {
  paint-order: stroke;
  letter-spacing: .4px;
}

.time {
  fill: #f4ece0;
  font-size: 36px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-family: system-ui, "Noto Sans CJK SC", sans-serif;
  letter-spacing: 1px;
}

.date {
  fill: #a7b5c3;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 1.3px;
}

.label {
  fill: #f0e6dc;
  font-family: "Noto Serif CJK SC", "SimSun", serif;
  font-weight: 600;
  font-size: 26px;
  letter-spacing: 2.8px;
}

.label.hot {
  fill: #e88c66;
}

.label.peak {
  fill: #fa9076;
}

.label.cool {
  fill: #c3cdd3;
}

.short-line {
  stroke: #69707a;
  stroke-width: 1.1;
  opacity: .36;
}

@media (prefers-reduced-motion: reduce) {
  .top-trigger .fire-top,
  .event .fire-visual,
  .event.visible .micro-ember {
    animation: none !important;
  }

  .event {
    transition: none !important;
  }

  .smoke-wisp {
    transition: none !important;
  }

  .timeline.is-playing .main-spine {
    animation: none !important;
    stroke-dashoffset: 0;
  }
}
</style>
</head>

<script>
(() => {

  const svg = document.getElementById("timeline");
  const trigger = document.getElementById("trigger");

  const events = [
    ...svg.querySelectorAll(".event")
  ];

  const timeouts = [];

  let done = false;

  // 清理之前的定时器
  function clearTasks() {
    while (timeouts.length) {
      clearTimeout(timeouts.pop());
    }
  }

  // 立即展示完整时间线（预览模式）
  function revealInstant() {
    clearTasks();

    svg.classList.remove("is-playing");

    svg.classList.add(
      "is-complete",
      "is-preview"
    );

    events.forEach(event => {
      event.classList.add("visible");
    });

    done = true;
  }

  // 点击火焰后，开始播放动画
  function start() {

    clearTasks();
    done = false;

    // 重置动画状态
    svg.classList.remove(
      "is-complete",
      "is-preview",
      "is-playing"
    );

    events.forEach(event => {
      event.classList.remove("visible");
    });

    // 触发重绘，允许重复播放
    void svg.getBoundingClientRect();

    svg.classList.add("is-playing");

    // 根据时间依次显示事件
    for (const event of events) {

      const delay = Number(
        event.dataset.delay
      );

      timeouts.push(
        setTimeout(() => {
          event.classList.add("visible");
        }, delay)
      );
    }

    // 六秒后完成
    timeouts.push(
      setTimeout(() => {

        svg.classList.remove("is-playing");
        svg.classList.add("is-complete");

        done = true;

      }, 6000)
    );
  }

  // 鼠标点击
  trigger.addEventListener("click", start);

  // 键盘触发
  trigger.addEventListener("keydown", event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {
      event.preventDefault();
      start();
    }

  });

  // 对外提供播放接口
  window.playHKFireTimeline = start;

  // URL参数支持
  const params = new URLSearchParams(
    location.search
  );

  // ?preview 显示完成状态
  if (params.has("preview")) {
    revealInstant();
  }

  // ?autoplay 自动播放
  if (params.has("autoplay")) {
    start();
  }

})();
</script>
